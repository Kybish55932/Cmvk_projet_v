</head>
<body>
  <!-- NAVBAR -->
  <div class="navbar">
    <div class="brand">Список нарушений</div>
    <div>
      Добро пожаловать, {{ request.user.username }}
      <button class="btn">Выйти</button>
    </div>
  </div>

  <!-- Фильтры -->
  <div class="filters">
    <h5>Фильтрация</h5>
    <div class="row">
      <div>
        <label>Дата от</label>
        <input type="date" id="dateFrom">
      </div>
      <div>
        <label>Дата до</label>
        <input type="date" id="dateTo">
      </div>
      <div>
        <label>Аэропорт</label>
        <select id="airport" multiple>
          {% for value in airports_choices %}
            <option value="{{ value }}"{% if value in selected_airports %} selected{% endif %}>{{ value }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label>Служба</label>
        <select id="service" multiple>
          {% for value in services_choices %}
            <option value="{{ value }}"{% if value in selected_services %} selected{% endif %}>{{ value }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label>Вид нарушения</label>
        <select id="violation" multiple>
          {% for value in violations_choices %}
            <option value="{{ value }}"{% if value in selected_violations %} selected{% endif %}>{{ value }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label>Кто нарушил</label>
        <input type="text" id="offenderFilter" placeholder="Поиск по ФИО...">
      </div>
      <div class="buttons-group">
        <button class="btn btn-success" id="applyFiltersBtn">Применить</button>
        <button class="btn" id="resetFiltersBtn">Сбросить</button>
      </div>
      <div style="margin-left:auto;">
        <button class="btn btn-success" id="exportExcelBtn">Экспорт в Excel</button>
      </div>
    </div>
  </div>

  <!-- Таблица -->
  <div class="table-container">
    <table id="violationsTable">
      <thead>
        <tr>
          <th>Дата</th>
          <th>Аэропорт</th>
          <th>Рейс</th>
          <th>Направление</th>
          <th>Прилет/Вылет</th>
